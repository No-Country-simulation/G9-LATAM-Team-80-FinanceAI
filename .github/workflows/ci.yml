name: CI - FinanceAI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-ai-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run backend tests
        run: mvn test

  ml-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [clasificador, perfil, recomendaciones]
    defaults:
      run:
        working-directory: ml-service/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt --break-system-packages
      - name: Run Python tests
        run: pytest -v
      - name: Smoke test - health check
        if: matrix.service != 'clasificador'
        run: |
          uvicorn api_${{ matrix.service }}:app --port 8099 &
          sleep 3
          curl -sf http://localhost:8099/health || (echo "Health check fallo" && exit 1)
          kill %1

  contract-tests:
    runs-on: ubuntu-latest
    needs: [ml-services]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies (perfil + recomendaciones)
        run: |
          pip install -r ml-service/perfil/requirements.txt --break-system-packages
          pip install -r ml-service/recomendaciones/requirements.txt --break-system-packages
      - name: Run contract tests between Perfil y Recomendaciones
        run: pytest tests/contract/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: financeAI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
