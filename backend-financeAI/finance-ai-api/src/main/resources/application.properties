spring.application.name=finance-ai-api
server.port=${PORT:8080}
financeai.ml.base-url=${ML_SERVICE_BASE_URL:http://127.0.0.1:8000}
financeai.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5174}
spring.jackson.default-property-inclusion=non_null
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/financeai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:financeai_app}
spring.datasource.password=${DB_PASSWORD:FinanceAI_local_2026!}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
financeai.session.hours=${SESSION_HOURS:24}
